name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tests replace the embedding and reranker models with stand-ins, so PyTorch (the biggest download) is not needed here.
      - name: Install dependencies (without PyTorch)
        run: |
          python -m pip install --upgrade pip
          grep -v -E '^(torch|sentence-transformers|transformers)==' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt

      # Every test_*.py is a plain script that prints "ok" lines and fails on the first wrong result.
      # They need no API key and no network; the search index is the copy committed in data/chroma_db.
      - name: Run the offline tests
        env:
          RAG_DB: data/chroma_db
        run: |
          for t in test_*.py; do
            echo "=== $t"
            python "$t"
          done
